name: Branch CI

# Builds both heads and runs the tests on working branches, so a change to shared code is
# known to compile for the platform its author could not build locally. Nothing is
# published; releases stay in release.yml, manual and from main.
on:
  push:
    branches: ['claude/**', 'dev']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet test Horus.Tests/Horus.Tests.csproj -c Release

  # The Windows head's C# against MAUI's reference assemblies, on Linux, in about a minute —
  # the first answer to "does it compile" while the real Windows build below installs its
  # workload. See tools/WinUiTypeCheck/WinUiTypeCheck.csproj for what it does not cover.
  windows-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet build tools/WinUiTypeCheck/WinUiTypeCheck.csproj -c Release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Android SDK packages the project targets
        run: >
          dotnet build Horus/Horus.csproj -t:InstallAndroidDependencies -f net10.0-android
          -p:TargetFrameworks=net10.0-android -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT
          -p:AcceptAndroidSDKLicenses=true
      # TargetFrameworks pinned for the same reason as in release.yml: restore otherwise
      # evaluates frameworks this runner has no workload for.
      - name: Build
        run: >
          dotnet build Horus/Horus.csproj -f net10.0-android -c Debug
          -p:TargetFrameworks=net10.0-android
          -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT
      - name: Warning codes
        if: always()
        run: >
          dotnet build Horus/Horus.csproj -f net10.0-android -c Debug
          -p:TargetFrameworks=net10.0-android -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT --no-restore -v m 2>&1
          | grep -oE "warning [A-Z]+[0-9]+" | sort | uniq -c || true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Build
        run: >
          dotnet build Horus/Horus.csproj -f net10.0-windows10.0.19041.0 -c Debug
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
      # A rehearsal of release.yml's Windows job, minus signing: the same publish, the same
      # payload script, the same MSI build. A release from this branch then fails only for
      # reasons a branch cannot see (secrets, the version chosen) — not, as once happened,
      # because the published layout is not the one the release expects.
      - name: Publish (as the release does)
        run: >
          dotnet publish Horus/Horus.csproj
          -f net10.0-windows10.0.19041.0 -c Release -r win-x64
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -p:SelfContained=true -p:UseMonoRuntime=false
          -p:ApplicationDisplayVersion=0.9.0 -p:ApplicationVersion=1
          -o publish/win-x64
      - name: Payload
        shell: pwsh
        run: ./packaging/windows/check-payload.ps1 publish/win-x64
      - name: MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          wix build -arch x64 `
            -d Version=0.9.0 `
            -d PublishDir="$(Resolve-Path publish/win-x64)" `
            packaging/windows/Horus.wxs `
            -o dist/Horus-rehearsal-win-x64.msi
          Write-Host "MSI $((Get-Item dist/Horus-rehearsal-win-x64.msi).Length) bytes"

  # The tunnel itself, on real Windows: wintun adapter, traffic through the proxy,
  # per-process routing, DNS through the TUN, live reload and swap, stop/start under load.
  # Hosted runners run as administrator, which creating the adapter needs. See
  # tools/WinTunnelTest/Program.cs; exit code is the number of failed checks.
  windows-tunnel:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Tunnel end to end
        run: dotnet run --project tools/WinTunnelTest -c Release
